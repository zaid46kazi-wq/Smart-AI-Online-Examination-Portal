<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGMR College - Online Examination System</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "primary": "#2f56c8",
              "primary-dim": "#1f49bb",
              "primary-container": "#6284f8",
              "on-primary": "#faf8ff",
              "surface": "#f8f9fa",
              "surface-container": "#ebeef0",
              "surface-container-low": "#f1f4f5",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#e5e9eb",
              "surface-container-highest": "#dee3e6",
              "on-surface": "#2d3335",
              "on-surface-variant": "#5a6062",
              "outline": "#767c7e",
              "outline-variant": "#adb3b5",
              "secondary-container": "#dde2f4",
              "error": "#a8364b",
              "error-container": "#f97386",
              "tertiary": "#6e567e",
              "tertiary-container": "#ebccfc",
              "on-secondary-container": "#4c5260",
              "on-tertiary-container": "#594268",
              "secondary": "#595f6e",
              "on-error-container": "#6e0523",
              "on-primary-container": "#000316",
            },
            fontFamily: {
              "headline": ["Public Sans"],
              "body": ["Inter"],
              "label": ["Inter"],
            },
            borderRadius: {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            }
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
      .font-headline { font-family: 'Public Sans', sans-serif; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
      .float-anim { animation: float 6s ease-in-out infinite; }
    </style>
  </head>
  <body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
