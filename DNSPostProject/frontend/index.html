<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGMR College - Online Examination System</title>
    <!-- Preload critical AI model assets for faster exam startup -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/vision_wasm_internal.js" as="script" crossorigin>
    <link rel="prefetch" href="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#2563EB',
                hover: '#1D4ED8',
                light: '#EFF6FF',
                50: '#EFF6FF',
                100: '#DBEAFE',
                200: '#BFDBFE',
                500: '#3B82F6',
                600: '#2563EB',
                700: '#1D4ED8',
                800: '#1E40AF',
              },
              slate: {
                50: '#F8FAFC',
                100: '#F1F5F9',
                200: '#E2E8F0',
                300: '#CBD5E1',
                400: '#94A3B8',
                500: '#64748B',
                600: '#475569',
                700: '#334155',
                800: '#1E293B',
                900: '#0F172A',
              },
              brand: '#2563EB',
              surface: '#FFFFFF',
              'surface-muted': '#F8FAFC',
              'surface-subtle': '#F1F5F9',
              border: '#E2E8F0',
              'border-subtle': '#F1F5F9',
              'border-input': '#CBD5E1',
              success: {
                DEFAULT: '#16A34A',
                light: '#F0FDF4',
                border: '#BBF7D0',
                text: '#15803D',
              },
              warning: {
                DEFAULT: '#D97706',
                light: '#FFFBEB',
                border: '#FDE68A',
                text: '#B45309',
              },
              danger: {
                DEFAULT: '#DC2626',
                light: '#FEF2F2',
                border: '#FECACA',
                text: '#B91C1C',
              },
              info: {
                DEFAULT: '#0284C7',
                light: '#F0F9FF',
                border: '#BAE6FD',
                text: '#0369A1',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              body: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              headline: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            borderRadius: {
              'DEFAULT': '0.375rem',
              'md': '0.5rem',
              'lg': '0.625rem',
              'xl': '0.75rem',
              '2xl': '1rem',
            },
            boxShadow: {
              'sm': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
              'DEFAULT': '0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.08)',
              'md': '0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.07)',
            }
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; vertical-align: middle; }
      body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    </style>
  </head>
  <body class="antialiased min-h-screen flex flex-col bg-[#F8FAFC] text-[#0F172A]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
